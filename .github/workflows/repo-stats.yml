name: Update repo stats

on:
    schedule:
        # 03:00 UTC daily.
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: repo-stats
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    repo-stats:
        name: Fetch GitHub stars & activity
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch repo stats
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm run repo-stats

            - name: Check for changes
              id: diff
              run: |
                  if [ -n "$(git status --porcelain -- apps/web/src/data/repo-stats.json)" ]; then
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push
              if: steps.diff.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add apps/web/src/data/repo-stats.json
                  git commit -m "chore: update repo stats"
                  git push
