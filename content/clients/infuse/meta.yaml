shortDescription: A polished, closed-source video player for iPhone, iPad, Apple TV, and Mac that connects directly to Jellyfin, Plex, and Emby libraries, with hardware-accelerated 4K HDR/Dolby Vision playback, AirPlay/Google Cast, and Trakt sync.
platforms:
    - ios
    - tvos
    - macos
mainPlatform: tvos
pricing: subscription
music: supported
links:
    - type: website
