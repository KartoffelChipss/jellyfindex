    - type: app-store
      url: https://apps.apple.com/app/infuse/id1136220934
installationLink:
    type: app-store
    url: https://apps.apple.com/app/infuse/id1136220934
previewImages:
    - image: ./preview-images/0.webp
    - image: ./preview-images/1.webp
      title: Library
    - image: ./preview-images/2.webp
      title: Movie details
    - image: ./preview-images/3.webp
      title: Now playing
features:
    direct-play: true
    hw-decode: true
    dolby-vision: true
    10bit-hevc: true
    airplay: true
    chromecast: true
    external-subtitles: true
