name: Pelagica
logo: ./logo.svg
banner: ./banner.svg
developerName: KartoffelChipss
developerGithub: KartoffelChipss
dateAdded: 2026-09-04
submittedBy: KartoffelChipss
openSource: true
license:
    name: GPL-3.0
    url: https://github.com/PelagicaApp/Pelagica/blob/main/LICENSE
shortDescription: A modern web, desktop and TV client for Jellyfin
platforms: [web, webos, tizen, windows, macos, linux]
mainPlatform: web
official: false
music: supported
previewImages:
    - image: './preview-images/home.webp'
      platform: web
      title: Home
    - image: './preview-images/library.webp'
      platform: web
      title: Library
    - image: './preview-images/series.webp'
      platform: web
      title: Series
    - image: './preview-images/episode.webp'
      platform: web
      title: Episode
    - image: './preview-images/music.webp'
      platform: web
      title: Music
    - image: './preview-images/search.webp'
      platform: web
      title: Search
    - image: './preview-images/custom_sections.webp'
      platform: web
      title: Custom Home Sections
    - image: './preview-images/webos-home.png'
      platform: webos
      title: Home
    - image: './preview-images/webos-library.png'
      platform: webos
      title: Library
    - image: './preview-images/webos-movie.png'
      platform: webos
      title: Movie
    - image: './preview-images/webos-search.png'
      platform: webos
      title: Search
    - image: './preview-images/webos-player.png'
      platform: webos
      title: Player
links:
    - type: github
      url: https://github.com/PelagicaApp/Pelagica
    - type: website
      url: https://pelagica.app
    - type: translations
      url: 'https://twoglot.com/@KartoffelChipss/pelagica'
      label: Help translate
    - type: other
      label: Demo
      url: https://demo.pelagica.app/
installationInstructions:
    web: |-
        You can find a web installation instruction in [the docs](https://pelagica.app/docs/installation).
    windows: |-
        You can download an `.exe` installer from [Releases](https://github.com/PelagicaApp/Pelagica/releases/latest).
    linux: |-
        You can download a `.deb`, a `.pkg.tar.zst` (Arch Linux), or an `.AppImage` from [Releases](https://github.com/PelagicaApp/Pelagica/releases/latest).
    webos: |-
        You can find a webOS installation instruction in [the docs](https://pelagica.app/docs/webos).
    tizen: |-
        You can find a Tizen installation instruction in [the docs](https://pelagica.app/docs/tizen).
features:
    hw-decode: true
    direct-play: true
    trickplay: true
    pgs-ass-subtitles: true
    lyrics: true
    quick-connect: true
    live-tv-dvr: true
    seerr-integration: true
    kevintweaks-watchlist: true
    streamystats-recommendations: true
relatedPlugins:
    - pelagica-jellyfin-plugin
aiUsed: true
aiDisclaimer: I treat AI like any other tool I use. It is not a seperate "person" that can code for me or design my software. I use it for research, for finding bugs or generating small code snippets.
