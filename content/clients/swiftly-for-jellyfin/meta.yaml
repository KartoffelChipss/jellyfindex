installationInstructions:
    ios: |-
        You can install Swiftly Player on iPhone and iPad from the [App Store](https://apps.apple.com/app/id6806824067).
    tvos: |-
        You can install Swiftly Player on Apple TV from the [App Store](https://apps.apple.com/app/id6806824067).
