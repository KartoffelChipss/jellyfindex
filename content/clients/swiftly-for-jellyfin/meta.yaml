installationInstructions:
    ios: |-
        Join the [TestFlight beta](https://testflight.apple.com/join/MqeP2cnj) to install on iPhone and iPad.
    tvos: |-
        Join the [TestFlight beta](https://testflight.apple.com/join/MqeP2cnj) to install on Apple TV.
    macos: |-
        Join the [TestFlight beta](https://testflight.apple.com/join/MqeP2cnj) to install on Mac.
    windows: |-
        Download the installer from [Releases](https://github.com/paulherter/swiftly-player/releases/latest) (64-bit, Windows 10 and 11).
    linux: |-
        Run the install script, which detects your distribution and adds the Swiftly package source so updates arrive with your normal system update:

        ```sh
        curl -fsSL https://raw.githubusercontent.com/paulherter/swiftly-player/main/Linux/Installieren/swiftly-installieren.sh | bash
        ```

        See the [README](https://github.com/paulherter/swiftly-player#-linux) for adding the package repository manually.
features:
    quick-connect: true
    direct-play: true
aiUsage: vibe-coded
aiDescription: The developer built the app together with Claude, with every commit crediting it as a co-author. The decisions, testing, and responsibility are the developer's own.
