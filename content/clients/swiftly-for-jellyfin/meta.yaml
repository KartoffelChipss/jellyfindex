        You can install Swiftly Player on Mac from the [App Store](https://apps.apple.com/app/id6806824067).
    windows: |-
        You can find the installation instructions for Windows in the [README](https://github.com/paulherter/swiftly-player#-windows).
    linux: |-
        You can find the installation instructions for Linux in the [README](https://github.com/paulherter/swiftly-player#-linux).
